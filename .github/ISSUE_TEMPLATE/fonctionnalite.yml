name: Fonctionnalité
description: Décrire une fonctionnalité à développer
labels: ['feat']
body:
  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Ce que l'utilisateur doit pouvoir faire, et pourquoi.
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      placeholder: |
        - [ ] L'utilisateur peut retirer les oignons du Classique
        - [ ] Le choix est repris sur la ligne de panier
        - [ ] Le changement est annoncé au lecteur d'écran
    validations:
      required: true
  - type: textarea
    id: accessibilite
    attributes:
      label: Points d'accessibilité à prévoir
      description: Accès clavier, annonces, contrastes, taille de cible.
