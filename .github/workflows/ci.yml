name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule une exécution encore en cours sur la même branche lorsqu'un nouveau
# commit est poussé, pour ne pas garder deux vérifications concurrentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Vérifie que chaque combinaison de couleurs utilisée par l'interface
      # atteint son seuil de contraste WCAG. Le script est sans dépendance, il
      # n'a donc besoin d'aucune installation préalable.
      - name: Vérifier les contrastes de la palette
        run: node scripts/verify-contrasts.mjs

      # Les étapes de typage, d'analyse statique, de tests unitaires, de tests
      # end-to-end et de détection d'anti-patterns de design arrivent avec le
      # socle technique, au lot 3.
