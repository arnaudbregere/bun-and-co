name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule une exécution encore en cours sur la même branche lorsqu'un nouveau
# commit est poussé, pour ne pas garder deux vérifications concurrentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Vérifie que chaque combinaison de couleurs utilisée par l'interface
      # atteint son seuil de contraste WCAG. Placée en premier car elle ne
      # dépend d'aucune construction.
      - name: Vérifier les contrastes de la palette
        run: pnpm contrasts

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Analyser le code
        run: pnpm lint

      - name: Vérifier les types
        run: pnpm typecheck

      # Les composants sont auto-importés : un atome peut employer une molécule
      # dans son gabarit sans aucune ligne d'import, donc sans qu'ESLint le
      # voie. Cette vérification porte sur les gabarits.
      - name: Vérifier les niveaux d'Atomic Design
        run: pnpm component-levels

      - name: Exécuter les tests unitaires
        run: pnpm test

      - name: Construire le rendu statique
        run: pnpm generate

      # Les deux vérifications suivantes portent sur le résultat construit, et
      # non sur les sources : le détecteur de design analyse une page rendue, et
      # l'ordre des couches n'est observable qu'après minification du CSS.
      - name: Vérifier l'ordre des couches de styles
        run: pnpm layer-order

      # La route du catalogue n'est préconstruite que si elle est déclarée dans
      # nitro.prerender.routes. L'oubli ne se verrait qu'en production, où aucun
      # processus Node ne répond.
      - name: Vérifier la route préconstruite du catalogue
        run: pnpm catalogue-route

      - name: Détecter les anti-patrons de design
        run: .claude/skills/impeccable/scripts/impeccable detect .output/public/index.html --no-advisory

      # L'atelier rassemble tous les composants livrés : c'est la page où le
      # détecteur voit le plus de balisage réel avant que les écrans du parcours
      # n'existent.
      - name: Détecter les anti-patrons de design dans l'atelier
        run: .claude/skills/impeccable/scripts/impeccable detect .output/public/workshop/index.html --no-advisory

  tests-end-to-end:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Un seul navigateur : la borne est un appareil unique, dont le navigateur
      # est connu.
      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Exécuter les parcours
        run: pnpm test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
