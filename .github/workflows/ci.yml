name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancels a run still in progress on the same branch when a new commit is
# pushed, so two checks never compete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per check. A single job hid which check failed behind one red cross,
# and stopped every later check at the first failure: a formatting slip meant
# the tests never ran. Jobs run in parallel and report one by one.
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Reads the colour tokens and fails when a declared pair falls below its WCAG
  # threshold. A plain Node script with no dependency, so this job skips the
  # install entirely.
  contrast-ratios:
    name: Contrast ratios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-contrasts.mjs

  # Components are auto-imported: an atom can use a molecule in its template
  # with no import line, so ESLint never sees the composition. This check reads
  # the templates. No dependency either.
  component-levels:
    name: Component levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-component-levels.mjs

  # The three checks below read the built site, not the sources. The build runs
  # once and they share its output through an artifact.
  build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm generate
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          retention-days: 1

  # The cascade order is only observable once the CSS is minified: the minifier
  # splits the @layer declaration and moves each layer before its first use.
  style-layer-order:
    name: Style layer order
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public
      - run: node scripts/verify-layer-order.mjs

  # The catalogue route is only prerendered when it is declared in
  # nitro.prerender.routes. Forgetting it would only show in production, where
  # no Node process answers.
  catalogue-route:
    name: Catalogue route
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public
      - run: node scripts/verify-catalogue-route.mjs

  # The detector analyses a rendered page, never a source file. The workshop is
  # where it sees the most real markup until the order screens exist.
  design-detector:
    name: Design detector
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public
      - name: Detect on the landing page
        run: .claude/skills/impeccable/scripts/impeccable detect .output/public/index.html --no-advisory
      - name: Detect on the workshop
        run: .claude/skills/impeccable/scripts/impeccable detect .output/public/workshop/index.html --no-advisory

  end-to-end-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # One browser only: a kiosk is a single device, with a known browser.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
